[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
# Overridden at runtime by AIEOS_DATABASE_URL (migrator) and AIEOS_SCHEMA_OWNER_ROLE.
# Never point this at production. Alembic does not embed credentials or CREATE ROLE.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
