[project]
name = "aieos"
version = "0.1.0"
description = "EduVijna AIEOS backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "temporalio>=1.31,<1.32",
    "nats-py>=2.15,<2.16",
    "uvicorn>=0.51,<0.52",
    "pyjwt>=2,<3",
    "cryptography>=50.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "gci_i02: Generic Content PostgreSQL schema tests",
    "gci_i03: Generic Content immutable version append tests",
    "gci_i04: Generic Content HTTP read/create foundation tests",
    "gci_i05: Generic Content version append, If-Match, and idempotency tests",
    "gci_i06: Generic Content review decision foundation tests",
    "gci_i07: Generic Content review Temporal workflow tests",
    "gci_i08: Generic Content events, transactional outbox, and NATS JetStream tests",
    "gci_i09: Generic Content publish and Publication history tests",
    "gci_i10: Generic Content version asset ResourceRef association tests",
    "gci_i11: Generic Content AI provenance and generation materialization tests",
    "gci_i12: Teacher OS Review Queue read projection tests",
    "gci_i13: Controlled migration import foundation tests",
    "gci_i14: Generic Content adversarial validation suite (tests only)",
    "sai_i01: Security Audit domain and application contracts",
    "sai_i02: PostgreSQL security audit ledger / RLS",
    "sai_i03: Generic Content API transactional security-audit integration",
    "sai_i04: AI materialization and controlled migration security-audit integration",
    "sai_i05: Final adversarial security-audit / transaction / tenancy gate",
    "ped_i01: Production/staging API runtime configuration and composition foundation",
    "ped_i02: API runtime database engine and readiness foundation",
    "ped_i03: Fail-closed API mutation activation safety interlock",
    "ped_i04: CI quality gates and immutable verified build bundle foundation",
    "ped_i06: ASGI server and NON_PRODUCTION OCI runtime viability foundation",
    "ped_i07: Trusted request identity and current-tenant SecurityContext foundation",
    "ped_i08: Concrete production JWT Bearer RequestIdentityAuthenticator",
    "ped_i09: Production Authorization Kernel (ADR-AIEOS-031)",
    "ped_i10a: Production Governance Adapter Foundation (ADR-AIEOS-032)",
    "ped_i10b1: Asset/File domain contracts (ADR-AIEOS-033)",
    "ped_i10b2: Asset PostgreSQL System of Record / SQLAlchemy / Alembic / RLS",
    "ped_i10b3: Asset BlobStore ingest and reconciliation foundation (ADR-AIEOS-033)",
    "ped_i10b4: Asset current-use authority provider (ADR-AIEOS-034)",
]
