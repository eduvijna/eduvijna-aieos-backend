[project]
name = "aieos"
version = "0.1.0"
description = "EduVijna AIEOS backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "gci_i02: Generic Content PostgreSQL schema tests",
    "gci_i03: Generic Content immutable version append tests",
]
