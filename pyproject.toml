[project]
name = "aieos"
version = "0.1.0"
description = "EduVijna AIEOS backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "gci_i02: Generic Content PostgreSQL schema tests",
    "gci_i03: Generic Content immutable version append tests",
    "gci_i04: Generic Content HTTP read/create foundation tests",
]
